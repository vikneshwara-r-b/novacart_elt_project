# Databricks Workflow Definition for Novacart use case study
resources:
  catalogs:
    novacart_catalog:
      name: novacart_catalog
      comment: 'Catalog created by Declarative Automation Bundles for Novacart Case Study'

  schemas:
    bronze_schema:
      name: bronze_schema
      catalog_name: ${resources.catalogs.novacart_catalog.name}
      comment: 'Bronze Schema in custom novacart catalog'
    silver_schema:
      name: silver_schema
      catalog_name: ${resources.catalogs.novacart_catalog.name}
      comment: 'Silver Schema in custom novacart catalog'
    gold_schema:
      name: gold_schema
      catalog_name: ${resources.catalogs.novacart_catalog.name}
      comment: 'Gold Schema in custom novacart catalog'
  
  jobs:
    novacart_ingest_and_transform_workflow:
      name: novacart_ingest_and_transform_workflow
      
      # Task definitions
      tasks:
        # Step 1: Execute Bronze ingestion notebook
        - task_key: bronze-ingestion
          notebook_task:
            notebook_path: ../notebooks/bronze_work.ipynb
            source: WORKSPACE
        
        # Step 2: Execute silver transformation notebook
        - task_key: silver-transformation
          depends_on:
            - task_key: bronze-ingestion
          notebook_task:
            notebook_path: ../notebooks/silver_work.ipynb
            source: WORKSPACE
        
        # Step 2: Execute silver transformation notebook
        - task_key: gold-transformation
          depends_on:
            - task_key: silver-transformation
          notebook_task:
            notebook_path: ../notebooks/gold_work.ipynb
            source: WORKSPACE
        
      
      # Timeout and retry configuration
      timeout_seconds: 0
      max_concurrent_runs: 1
