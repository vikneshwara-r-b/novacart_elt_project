# This is a Databricks asset bundle definition for novacart_elt.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: novacart_elt
  uuid: 9ea62b31-5428-4498-b80c-50d44e71ad66
  # Direct deployment engine is required for Unity Catalog catalog/schema resources.
  # Requires Databricks CLI >= 0.279.0.
  # Deploy using: DATABRICKS_BUNDLE_ENGINE=direct databricks bundle deploy
  databricks_cli_version: '>= 0.279.0'

# Variables - Set via environment variables before deployment
variables:
  user_email:
    description: "User email for permissions"
    default: ${env.USER_EMAIL}

include:
  - resources/*.yml
  - resources/*/*.yml

targets:

  prod:
    mode: production
    workspace:
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}