bundle:
  name: novacart_elt
  engine: direct

include:
  - resources/*.yml
  - resources/*/*.yml

targets:

  prod:
    mode: production
    workspace:
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}